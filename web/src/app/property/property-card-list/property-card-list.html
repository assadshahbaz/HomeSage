<section
  aria-label="Cited properties"
  [attr.aria-busy]="loading() || null"
  class="flex flex-col gap-3"
>
  @if (loading()) {
    @for (skeleton of skeletons; track skeleton) {
      <hs-card>
        <div class="flex flex-col gap-2">
          <hs-skeleton />
          <hs-skeleton />
          <hs-skeleton shape="block" />
        </div>
      </hs-card>
    }
  } @else if (isEmpty()) {
    <hs-empty-state
      heading="No properties cited"
      description="The answer did not refer to any specific listing."
    />
  } @else {
    <p class="text-sm text-ink-muted">
      Only features the listing states are shown. A feature not listed may still be there.
    </p>
    @for (property of cards(); track property.id) {
      <hs-property-card [summary]="property" [highlighted]="property.id === highlightedId()" />
    }
  }
</section>
