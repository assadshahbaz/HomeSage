<hs-card [heading]="summary().address" [highlighted]="highlighted()">
  <hs-badge hsCardHeader tone="accent" size="md">{{ price() }}</hs-badge>
  <div class="flex flex-col gap-2">
    @if (size()) {
      <p>{{ size() }}</p>
    }
    @if (place()) {
      <p class="text-sm text-ink-muted">{{ place() }}</p>
    }
    @if (hasDetails()) {
      <ul class="flex flex-wrap gap-2" aria-label="Listed details">
        @if (councilTax()) {
          <li>
            <hs-badge>{{ councilTax() }}</hs-badge>
          </li>
        }
        @for (feature of features(); track feature) {
          <li>
            <hs-chip size="sm">{{ feature }}</hs-chip>
          </li>
        }
      </ul>
    }
  </div>
</hs-card>
